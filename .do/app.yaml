name: rootly-mcp
region: nyc
services:
  - name: rootly-mcp
    github:
      repo: wyre-technology/rootly-mcp
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
    envs:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HTTP_HOST
        value: 0.0.0.0
      # Single-tenant App Platform service. The image defaults to gateway
      # mode; this override keeps the process token. HTTP still requires
      # CONDUIT_S2S_SECRET or the process exits.
      - key: AUTH_MODE
        value: env
      - key: ROOTLY_API_TOKEN
        type: SECRET
        scope: RUN_TIME
      - key: CONDUIT_S2S_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: LOG_LEVEL
        value: info
